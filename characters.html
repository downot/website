<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DownOT's Character Relationship Chart</title>
<style>
:root{
  --bg:#070510;
  --ink:#e9e7f7;
  --ink-dim:#a5a1c2;
  --panel:rgba(14,11,28,.85);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",Roboto,sans-serif;
  overflow:hidden;
  display:flex;flex-direction:column;
  background-image:
    radial-gradient(1200px 700px at 18% -10%, rgba(88,28,135,.32), transparent 60%),
    radial-gradient(1000px 600px at 85% 110%, rgba(8,90,110,.30), transparent 60%),
    radial-gradient(800px 500px at 70% 15%, rgba(190,24,93,.14), transparent 60%);
}
#stars{position:fixed;inset:0;z-index:0}
.nebula{position:fixed;border-radius:50%;filter:blur(110px);mix-blend-mode:screen;pointer-events:none;z-index:0}
.n1{width:520px;height:520px;left:-140px;top:16%;background:rgba(124,58,237,.20);animation:drift1 26s ease-in-out infinite alternate}
.n2{width:620px;height:620px;right:-180px;top:42%;background:rgba(14,165,233,.16);animation:drift2 32s ease-in-out infinite alternate}
.n3{width:420px;height:420px;left:38%;bottom:-160px;background:rgba(236,72,153,.13);animation:drift1 24s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(70px,-50px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-80px,60px) scale(.9)}}

header{position:relative;z-index:2;text-align:center;padding:16px 12px 4px;animation:fadeDown .9s ease both}
h1{
  font-size:clamp(19px,3vw,32px);font-weight:800;letter-spacing:.10em;
  background:linear-gradient(90deg,#22d3ee,#f472b6,#a78bfa,#fbbf24,#22d3ee);
  background-size:320% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:hue 9s linear infinite;
  filter:drop-shadow(0 0 18px rgba(167,139,250,.35));
}
@keyframes hue{to{background-position:320% 0}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.sub{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.badge{
  font-size:10.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
  color:var(--ink-dim);border:1px solid rgba(255,255,255,.14);
  padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.04);
}
.legend{margin-top:10px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
.li i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}

main{flex:1;position:relative;z-index:1;min-height:0;display:flex;align-items:center;justify-content:center}
#stageWrap{position:relative}
#stage{position:absolute;top:0;left:0;width:1540px;height:900px;transform-origin:0 0}
#edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.section-label{
  position:absolute;font-size:12px;font-weight:800;letter-spacing:.42em;text-transform:uppercase;
  color:rgba(233,231,247,.42);padding-left:4px;pointer-events:none;
}
.section-label::before{content:"";display:inline-block;width:26px;height:1px;background:linear-gradient(90deg,transparent,rgba(233,231,247,.5));vertical-align:middle;margin-right:10px}
.section-label.hero{
  font-size:15px;letter-spacing:.34em;transform:translateX(-50%);
  background:linear-gradient(90deg,#ffd166,#ff9f43 45%,#ffd166);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,180,70,.35));
}
.section-label.hero::before{background:linear-gradient(90deg,transparent,rgba(255,209,102,.85))}
.section-label.mid{transform:translateX(-50%);text-align:center}
.card.hero{border-color:rgba(255,209,102,.42);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 46px rgba(255,180,70,.18)}
.card.hero::after{content:"★";position:absolute;top:7px;right:12px;font-size:14px;color:#ffd166;text-shadow:0 0 12px rgba(255,209,102,.9)}
.duo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.duo img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.25);margin:0 -9px;box-shadow:0 4px 16px rgba(0,0,0,.55)}
.duo img:first-child{z-index:1}
.p-avatar.duo{display:flex;align-items:center;justify-content:center}
.p-avatar.duo img{position:static;width:76px;height:76px;margin:0 -11px}

.node{position:absolute;width:260px;height:330px;cursor:pointer;animation:float 7s ease-in-out infinite,arm .7s linear backwards;animation-delay:var(--fd,0s),var(--d,0s);z-index:2;filter:saturate(1);transition:opacity .55s ease,filter .55s ease}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes arm{from{pointer-events:none}}
.node.hero{width:300px;height:380px}
.node.hero .avatar{width:132px;height:132px}
.node.hero .ring{background:conic-gradient(from 0deg,#ffd166,transparent 32%,#ffd166 58%,transparent 82%,#ffd166)}
.node.hero .name{font-size:23px;text-shadow:0 0 18px rgba(255,209,102,.85),0 0 36px rgba(255,159,67,.45)}
.card{
  position:absolute;inset:0;border-radius:18px;
  background:linear-gradient(165deg,rgba(255,255,255,.075),rgba(255,255,255,.015) 55%);
  border:1px solid rgba(255,255,255,.11);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 14px 40px rgba(0,0,0,.45);
  padding:16px 14px 12px;display:flex;flex-direction:column;align-items:center;
  transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease,opacity .3s ease,filter .3s ease;
  animation:pop .7s cubic-bezier(.2,.9,.25,1.2) backwards;animation-delay:var(--d,0s);
}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.9)}}
.basebar{margin-top:auto;width:70%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.55;box-shadow:0 0 12px var(--cg)}
.node:hover .card{transform:translateY(-7px) scale(1.03);border-color:var(--c);box-shadow:0 20px 54px rgba(0,0,0,.55),0 0 34px var(--cg)}
.node.on .card{border-color:var(--c);box-shadow:0 20px 54px rgba(0,0,0,.55),0 0 40px var(--cg)}
#stage.focused .node:not(.on){opacity:.22;filter:saturate(.35) blur(.4px)}
#stage.focused .node:not(.on) .card{animation-play-state:paused}

.avatar{position:relative;width:112px;height:112px;border-radius:50%;flex:none}
.ring{
  position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(from 0deg,var(--c),transparent 32%,var(--c) 58%,transparent 82%,var(--c));
  animation:spin 5.5s linear infinite;
  opacity:.9;
}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.22)}
.name{margin-top:12px;font-size:21px;font-weight:800;letter-spacing:.05em;text-shadow:0 0 22px var(--cg)}
.sub2{margin-top:3px;font-size:11.5px;letter-spacing:.34em;color:var(--c);opacity:.9}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;min-height:21px}
.chip{font-size:9.5px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;padding:3.5px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.chip.gay{background:linear-gradient(90deg,#f87171,#fbbf24,#4ade80,#60a5fa,#c084fc);color:#0b0916;border-color:transparent}
.chip.bi{background:linear-gradient(90deg,#c084fc,#38bdf8);color:#0b0916;border-color:transparent}
.chip.het{border-color:rgba(96,165,250,.5);color:#93c5fd}
.chip.human{border-color:rgba(148,163,184,.5);color:#cbd5e1}
.chip.incest{border-color:rgba(251,113,133,.55);color:#fda4af}
.chip.nekomimi{border-color:rgba(244,114,182,.55);color:#f9a8d4}
.chip.inumimi{border-color:rgba(245,158,11,.55);color:#fcd34d}
.chip.usagimimi{border-color:rgba(163,230,53,.55);color:#bef264}
.chip.kemomimi{border-color:rgba(251,146,60,.55);color:#fdba74}
.chip.couple{border-color:rgba(244,114,182,.6);color:#f9a8d4}
.desc{margin-top:10px;font-size:11.5px;line-height:1.55;color:#b7b3d2;text-align:center}

.edge{transition:opacity .55s ease}
#stage.focused .edge:not(.on){opacity:.13}
.e-glow{fill:none;stroke-width:7;opacity:.28;filter:url(#fGlow)}
.e-base{fill:none;stroke-width:1.8;opacity:.75}
.e-flow{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:16 150;opacity:0;animation:flow 2.6s linear infinite}
#stage.live .e-flow{opacity:.85}
@keyframes flow{to{stroke-dashoffset:-166}}
.pulse{opacity:0}
#stage.live .pulse{opacity:1;transition:opacity .8s}
.edge.on .e-base{stroke-width:3;opacity:1}
.edge.on .e-glow{opacity:.5}
.edge.on .e-flow{animation-duration:1.1s}
.meteor{position:absolute;width:0;height:0;z-index:5;pointer-events:none;opacity:0;
  transform:translate(-90px,-140px);
  animation:meteorfall var(--md) cubic-bezier(.3,.7,.4,1) var(--mdel) forwards}
.meteor .head{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;
  background:#fff;box-shadow:0 0 6px #fff,0 0 14px var(--c),0 0 28px var(--c)}
.meteor .tail{position:absolute;left:-2px;top:-1.6px;width:92px;height:4px;border-radius:4px;
  transform-origin:0 50%;transform:rotate(-123deg);
  background:linear-gradient(90deg,#fff,var(--c) 45%,transparent)}
.mflash{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;z-index:5;pointer-events:none;
  background:radial-gradient(circle,#fff 0%,var(--c) 42%,transparent 70%);
  opacity:0;transform:scale(.3);animation:mflash .55s ease-out var(--fdel) forwards}
@keyframes meteorfall{
  0%{opacity:0;transform:translate(-90px,-140px)}
  15%{opacity:1}
  80%{opacity:1}
  100%{opacity:0;transform:translate(0,0)}
}
@keyframes mflash{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(2.3)}}
.p-pics{margin-top:22px;border-top:1px solid rgba(255,255,255,.1);padding-top:16px;overflow:hidden}
.p-pictrack{display:flex;width:max-content;animation:ppicroll var(--pdur,8s) linear infinite}
.p-pics:hover .p-pictrack{animation-play-state:paused}
@keyframes ppicroll{to{transform:translateX(-50%)}}
.p-picrow{display:flex;gap:10px;padding-right:10px;flex:none}
.p-picrow img{height:340px;width:272px;object-fit:cover;border-radius:12px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.p-pics.single .p-pictrack{animation:none}
.elabel{
  position:absolute;transform:translate(-50%,-50%);z-index:3;pointer-events:none;
  font-size:10.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;
  padding:5px 13px;border-radius:999px;border:1px solid;background:rgba(9,7,20,.78);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);white-space:nowrap;
  transition:opacity .55s,transform .35s;
}
.elabel b{color:var(--c);text-shadow:0 0 12px var(--c)}
#stage.focused .elabel:not(.on){opacity:.15}
.elabel.on{transform:translate(-50%,-50%) scale(1.12)}
#stage.instant .card{animation:none}

#pagehint{text-align:center;font-size:9.5px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(233,231,247,.30);padding-bottom:8px;position:relative;z-index:2}
#pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:2px 0 16px;position:relative;z-index:12}
#pager button{
  width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
  background:rgba(14,11,28,.55);color:var(--ink-dim);font-size:17px;line-height:1;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:color .25s,background .25s,box-shadow .25s,opacity .25s;
}
#pager button:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.1);box-shadow:0 0 16px rgba(124,107,255,.45)}
#pager button:disabled{opacity:.22;cursor:default}
#pdots{display:flex;align-items:center;gap:7px}
#pdots i{width:7px;height:7px;border-radius:99px;background:rgba(255,255,255,.22);transition:width .35s,background .35s,box-shadow .35s}
#pdots i.on{width:22px;background:linear-gradient(90deg,#6366f1,#f472b6);box-shadow:0 0 12px rgba(244,114,182,.6)}

#lang{
  position:fixed;top:14px;right:16px;z-index:30;display:flex;gap:2px;padding:3px;border-radius:999px;
  border:1px solid rgba(255,255,255,.14);background:rgba(14,11,28,.62);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 8px 28px rgba(0,0,0,.35);
}
#lang button{
  border:none;background:none;color:var(--ink-dim);font-size:11px;font-weight:700;letter-spacing:.08em;
  padding:5px 13px;border-radius:999px;cursor:pointer;transition:color .25s,background .25s,box-shadow .25s;
  font-family:inherit;
}
#lang button:hover{color:#fff}
#lang button.on{background:linear-gradient(90deg,#6366f1,#a855f7);color:#fff;box-shadow:0 0 14px rgba(139,92,246,.5)}

#scrim{position:fixed;inset:0;z-index:9;background:rgba(4,3,10,.45);opacity:0;pointer-events:none;transition:opacity .4s}
#panel{
  position:fixed;top:0;right:0;height:100%;width:390px;max-width:92vw;z-index:10;
  background:var(--panel);
  -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  border-left:1px solid rgba(255,255,255,.12);
  transform:translateX(106%);transition:transform .5s cubic-bezier(.2,.85,.25,1);
  padding:30px 28px;overflow-y:auto;
}
#panel.open{transform:none}
#panel.open ~ #scrim,#scrim.open{opacity:1;pointer-events:auto}
#pclose{
  position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:var(--ink-dim);
  font-size:16px;cursor:pointer;transition:.25s;line-height:1;
}
#pclose:hover{background:rgba(255,255,255,.12);color:#fff;transform:rotate(90deg)}
.p-avatar{position:relative;width:160px;height:200px;margin:8px auto 0;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 44px rgba(0,0,0,.5)}
.p-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-name{text-align:center;margin-top:16px;font-size:27px;font-weight:800;letter-spacing:.06em;text-shadow:0 0 26px var(--cg)}
.p-sub{text-align:center;margin-top:4px;font-size:12px;letter-spacing:.4em;color:var(--c)}
.p-tags{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.p-desc{margin-top:20px;font-size:13.5px;line-height:1.75;color:#c3bfdd;border-top:1px solid rgba(255,255,255,.1);padding-top:18px}
.p-rel{margin-top:22px;border-top:1px solid rgba(255,255,255,.1);padding-top:18px}
.p-rel h3{font-size:11px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:12px}
.p-rel ul{list-style:none}
.p-rel li{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px}
.p-rel li i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.p-rel .rel-type{color:var(--ink-dim);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.p-rel button{
  background:none;border:none;color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer;
  letter-spacing:.03em;padding:0;transition:color .2s;
}
.p-rel button:hover{color:var(--c2);text-shadow:0 0 14px var(--c2)}

footer{position:relative;z-index:2;text-align:center;padding:10px 12px 14px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#8b86ad;animation:fadeDown 1.2s ease both}
footer b{color:#c4bfea}
footer .author{margin-top:7px;font-size:10.5px;letter-spacing:.14em;text-transform:none;color:#7d789c}
footer .author a{color:#a89fd4;text-decoration:none;transition:color .25s}
footer .author a:hover{color:#e8e4ff}
footer .copyright{margin-top:5px;font-size:10px;letter-spacing:.14em;text-transform:none;color:#6f6a8c}

@media (max-width:720px){
  .legend{gap:10px}
  #panel{width:100vw;max-width:100vw}
  header{padding-top:46px}
  #lang{top:10px;right:10px}
  #lang button{padding:4px 10px;font-size:10px}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula n1"></div><div class="nebula n2"></div><div class="nebula n3"></div>

<div id="lang">
  <button data-lang="en" class="on">EN</button>
  <button data-lang="ja">日本語</button>
</div>

<header>
  <h1 id="title">DownOT's Character Relationship Chart</h1>
  <div class="sub" id="badges"></div>
  <div class="legend" id="legend"></div>
</header>

<main>
  <div id="stageWrap">
    <div id="stage">
      <svg id="edges" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
      </svg>
    </div>
  </div>
</main>

<footer id="footer"></footer>
<div id="pagehint"></div>
<div id="pager">
  <button id="pprev" aria-label="previous page">‹</button>
  <span id="pdots"><i class="on"></i><i></i></span>
  <button id="pnext" aria-label="next page">›</button>
</div>

<div id="scrim"></div>
<aside id="panel">
  <button id="pclose" aria-label="close">✕</button>
  <div class="p-avatar" id="pavatar"><img id="pimg" src="" alt=""></div>
  <div class="p-name" id="pname"></div>
  <div class="p-sub" id="psub"></div>
  <div class="p-tags" id="ptags"></div>
  <div class="p-desc" id="pdesc"></div>
  <div class="p-rel" id="pwrap">
    <h3 id="prel-title">Connections</h3>
    <ul id="prel"></ul>
  </div>
  <div class="p-pics" id="ppics"><div class="p-pictrack" id="ppictrack"></div></div>
</aside>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
const TAGS = {
  gay:{en:'Gay',ja:'ゲイ'}, bi:{en:'Bisexual',ja:'両性愛'}, het:{en:'Hetero',ja:'異性愛'},
  human:{en:'Human',ja:'人間'}, incest:{en:'Incest',ja:'近親'},
  nekomimi:{en:'Nekomimi',ja:'ネコミミ'}, inumimi:{en:'Inumimi',ja:'イヌミミ'},
   usagimimi:{en:'Usagimimi',ja:'ウサギミミ'}, kemomimi:{en:'Kemomimi',ja:'ケモノミミ'},
   couple:{en:'Couple',ja:'カップル'}
};
const NODES = [
  {id:'tiantian', pg:1, x:175, y:96, c:'#22d3ee', hero:true, tags:['gay','human'],
    name:{en:'Tian-tian',ja:'テンテン'}, sub:{en:'',ja:''},
    desc:{en:"Nan-nan's partner and first love. A gamer who works part-time to buy games.",
          ja:'ナンナンのパートナーであり、初恋の相手。ゲームを買うためにバイトをするゲーマー。'}},
  {id:'nannan', pg:1, x:485, y:96, c:'#f472b6', hero:true, tags:['bi','nekomimi'],
    name:{en:'Nan-nan',ja:'ナンナン'}, sub:{en:'',ja:''},
    desc:{en:"Partner to both Tian-tian and Wen-wen.",
          ja:'テンテンとウェンウェン、両方のパートナー。'},
    jp:{en:'An Early Core of the Story',ja:'物語初期の中心人物'}},
  {id:'wenwen', pg:1, x:795, y:96, c:'#34d399', hero:true, tags:['het','nekomimi'],
    name:{en:'Wen-wen',ja:'ウェンウェン'}, sub:{en:'',ja:''},
    desc:{en:"Nan-nan's partner. Often enjoys going on outings with him.",
          ja:'ナンナンのパートナー。よく一緒に外出を楽しんでいる。'}},
  {id:'leo', pg:1, x:1105, y:96, c:'#a78bfa', hero:true, tags:['bi','nekomimi'],
    name:{en:'Leo',ja:'リオ'}, sub:{en:'',ja:''},
    desc:{en:"Wen-wen's distant cousin. A night wanderer who, despite being bullied, is helped by many.",
          ja:'ウェンウェンの遠い親戚。夜にさまよう彼はいじめられてきたが、多くの人の助けを受けている。'}},
  {id:'brosis', pg:1, x:40, y:546, c:'#fb7185', tags:['incest','human'],
    name:{en:'Brother & Sister',ja:'兄妹'}, sub:{en:'兄 & 妹',ja:''},

function cardHTML(n){
  const sub = L(n.sub), desc = L(n.desc), jp = (n.jp ? L(n.jp) : '');
  const avs = AVATARS[n.id];
  const avatar = Array.isArray(avs)
    ? '<div class="avatar"><div class="ring"></div><div class="duo">'+avs.map(s=>'<img src="'+s+'" alt="'+L(n.name)+'" draggable="false">').join('')+'</div></div>'
    : '<div class="avatar"><div class="ring"></div><img src="'+avs+'" alt="'+L(n.name)+'" draggable="false"></div>';
  return '<div class="card'+(n.hero ? ' hero' : '')+'">'+
    avatar+
    '<div class="name">'+L(n.name)+'</div>'+
    (sub ? '<div class="sub2">'+sub+'</div>' : '')+
    (n.tags.length ? '<div class="tags">'+n.tags.map(t=>'<span class="chip '+t+'">'+L(TAGS[t])+'</span>').join('')+'</div>' : '')+
    (desc ? '<div class="desc">'+desc+'</div>' : '')+
    (jp ? '<div class="desc" style="letter-spacing:.2em;color:var(--c)">'+jp+'</div>' : '')+
    '<div class="basebar"></div>'+
  '</div>';
}

function buildStage(animate, fast){
  const P = PAGES[page-1];
  stage.style.width = P.w+'px'; stage.style.height = P.h+'px';
  stage.querySelectorAll('.node,.elabel,.section-label,.meteor,.mflash').forEach(e=>e.remove());
  svg.querySelectorAll('.edge').forEach(e=>e.remove());
  edgeEls = [];
  stage.classList.toggle('instant', !animate);
  SECTIONS.filter(s=>s.pg===page).forEach(s=>{
    const d = document.createElement('div');
    d.className = 'section-label' + (s.hero ? ' hero' : '') + (s.mid ? ' mid' : '');
    d.style.left = s.x+'px'; d.style.top = s.y+'px';
    d.textContent = (s.hero ? '★ ' : '') + U().series[s.i];
    stage.appendChild(d);
  });
  NODES.filter(n=>n.pg===page).forEach((n,i)=>{
    const el = document.createElement('div');
    el.className = 'node'; el.dataset.id = n.id;
    el.style.left = n.x+'px'; el.style.top = n.y+'px';
    el.style.setProperty('--c', n.c);
    el.style.setProperty('--cg', n.c+'55');
    el.style.setProperty('--d', animate ? ((fast?0.05:0.35) + i*(fast?0.04:0.09))+'s' : '0s');
    el.style.setProperty('--fd', (i*0.55)+'s');
    el.innerHTML = cardHTML(n);
    el.addEventListener('mouseenter',()=>{ clearTimeout(hoverTimer); hovered = n.id; applyFocus(); });
    el.addEventListener('mouseleave',()=>{ hoverTimer = setTimeout(()=>{ hovered = null; applyFocus(); }, 140); });
    el.addEventListener('click',ev=>{
      ev.stopPropagation();
      selected = (selected===n.id) ? null : n.id;
      if(selected) openPanel(n); else closePanel();
      applyFocus();
    });
    stage.appendChild(el);
  });
  const growDur = fast ? 0.5 : 0.8;
  const edgeDelay = i => (fast?0.45:1.5) + i*growDur;
  EDGES.filter(e=>byId[e.a].pg===page && byId[e.b].pg===page).forEach((e,i)=>{
    const A = byId[e.a], B = byId[e.b];
    const x1 = A.x+130, y1 = A.y+165, x2 = B.x+130, y2 = B.y+165;
    const d = 'M '+x1+' '+y1+' L '+x2+' '+y2;
    const g = document.createElementNS(SVGNS,'g');
    g.setAttribute('class','edge');
    const mk = (cls,extra)=>{
      const p = document.createElementNS(SVGNS,'path');
      p.setAttribute('class',cls); p.setAttribute('d',d);
      if(extra) Object.entries(extra).forEach(([k,v])=>p.setAttribute(k,v));
      return p;
    };
    const glow = mk('e-glow',{stroke:e.c});
    const base = mk('e-base',{stroke:e.c});
    const flow = mk('e-flow');
    g.appendChild(glow); g.appendChild(base); g.appendChild(flow);
    const len = Math.hypot(x2-x1,y2-y1);
    if(animate){
      base.style.strokeDasharray = len; base.style.strokeDashoffset = len; base.style.opacity = 0;
      base.style.transition = 'stroke-dashoffset '+growDur+'s ease '+edgeDelay(i)+'s, opacity .5s ease '+edgeDelay(i)+'s, stroke-width .3s';
      glow.style.strokeDasharray = len; glow.style.strokeDashoffset = len;
      glow.style.opacity = 0; glow.style.transition = 'stroke-dashoffset '+growDur+'s ease '+edgeDelay(i)+'s, opacity .4s ease '+(edgeDelay(i)+0.1)+'s';
    } else {
      base.style.opacity = .75; glow.style.opacity = .28;
    }
    for(let k=0;k<2;k++){
      const c = document.createElementNS(SVGNS,'circle');
      c.setAttribute('class','pulse'); c.setAttribute('r','3.4'); c.setAttribute('fill',e.c);
      c.style.filter = 'drop-shadow(0 0 6px '+e.c+')';
      const am = document.createElementNS(SVGNS,'animateMotion');
      am.setAttribute('dur','3.2s'); am.setAttribute('repeatCount','indefinite');
      am.setAttribute('path',d);
      am.setAttribute('begin',(k*1.6 - 3.2)+'s');
      c.appendChild(am); g.appendChild(c);
    }
    svg.appendChild(g);
    const lab = document.createElement('div');
    lab.className = 'elabel';
    lab.style.left = ((x1+x2)/2)+'px'; lab.style.top = ((y1+y2)/2)+'px';
    lab.style.borderColor = e.c+'66'; lab.style.setProperty('--c',e.c);
    lab.innerHTML = '<b>'+L(e.type)+'</b>';
    if(animate){
      lab.style.opacity = 0;
      lab.style.transition = 'opacity .7s ease '+(edgeDelay(i)+0.4)+'s, transform .35s';
    } else {
      lab.style.opacity = 1;
    }
    stage.appendChild(lab);
    edgeEls.push({e,g,lab});
    if(animate){
      if(i===0){
        const md = fast ? 0.4 : 0.55;
        const mt = document.createElement('div');
        mt.className = 'meteor';
        mt.style.left = x1+'px'; mt.style.top = y1+'px';
        mt.style.setProperty('--c', e.c);
        mt.style.setProperty('--md', md+'s');
        mt.style.setProperty('--mdel', Math.max(0, edgeDelay(i)-md)+'s');
        mt.innerHTML = '<i class="tail"></i><i class="head"></i>';
        stage.appendChild(mt);
      }
      const fl = document.createElement('div');
      fl.className = 'mflash';
      fl.style.left = x1+'px'; fl.style.top = y1+'px';
      fl.style.setProperty('--c', e.c);
      fl.style.setProperty('--fdel', edgeDelay(i)+'s');
      stage.appendChild(fl);
    }
  });
  if(animate){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      edgeEls.forEach(({g,lab})=>{
        const base = g.querySelector('.e-base');
        base.style.strokeDashoffset = 0; base.style.opacity = .75;
        const gl = g.querySelector('.e-glow');
        gl.style.strokeDashoffset = 0; gl.style.opacity = .28;
        lab.style.opacity = 1;
      });
    }));
  }
}

  document.getElementById('footer').innerHTML = '<b>'+U().footer1+'</b> &nbsp;·&nbsp; '+U().footer2+
    '<div class="author">'+U().author+' &nbsp;·&nbsp; '+U().links.map(l=>'<a href="'+l.h+'" target="_blank" rel="noopener">'+l.t+'</a>').join(' &nbsp;·&nbsp; ')+'</div>'+
    '<div class="copyright">'+U().copyright+'</div>';

function fit(){
  const main = document.querySelector('main');
  const r = main.getBoundingClientRect();
  const P = PAGES[page-1];
  const s = Math.min(r.width/P.w, r.height/P.h, 1.35);
  const wrap = document.getElementById('stageWrap');
  wrap.style.width = P.w*s+'px'; wrap.style.height = P.h*s+'px';
  stage.style.transform = 'scale('+s+')';
}
addEventListener('resize', fit); fit();

function updatePager(){
  document.querySelectorAll('#pdots i').forEach((d,i)=>d.classList.toggle('on', i===page-1));
  document.getElementById('pprev').disabled = page===1;
  document.getElementById('pnext').disabled = page===PAGES.length;
}
function goPage(p){
  if(p<1 || p>PAGES.length || p===page) return;
  page = p;
  if(selected && byId[selected].pg !== p){ selected = null; closePanel(); }
  hovered = null;
  buildStage(true, true);
  fit();
  applyFocus();
  updatePager();
}
document.getElementById('pprev').addEventListener('click',()=>goPage(page-1));
document.getElementById('pnext').addEventListener('click',()=>goPage(page+1));
let wheelLock = 0;
addEventListener('wheel',ev=>{
  if(ev.target.closest && ev.target.closest('#panel')) return;
  const now = Date.now();
  if(now - wheelLock < 650) return;
  if(Math.abs(ev.deltaY) < 8 || Math.abs(ev.deltaY) < Math.abs(ev.deltaX)) return;
  wheelLock = now;
  goPage(ev.deltaY > 0 ? page+1 : page-1);
},{passive:true});

function applyFocus(){
  const id = hovered || selected;
  if(!id){
    stage.classList.remove('focused');
    document.querySelectorAll('.node').forEach(n=>n.classList.remove('on'));
    edgeEls.forEach(({g,lab})=>{g.classList.remove('on'); lab.classList.remove('on')});
    return;
  }
  stage.classList.add('focused');
  const on = new Set([id]);
  edgeEls.forEach(({e,g,lab})=>{
    const hit = e.a===id || e.b===id;
    if(hit){ on.add(e.a); on.add(e.b); }
    g.classList.toggle('on', hit);
    lab.classList.toggle('on', hit);
  });
  document.querySelectorAll('.node').forEach(n=>n.classList.toggle('on', on.has(n.dataset.id)));
}
document.addEventListener('click',ev=>{
  if(selected && ev.target.isConnected && !ev.target.closest('#panel') && !ev.target.closest('.node')){
    selected = null; closePanel(); applyFocus();
  }
});
addEventListener('keydown',e=>{
  if(e.key==='Escape' && selected){ selected=null; closePanel(); applyFocus(); }
  if(e.key==='ArrowRight') goPage(page+1);
  if(e.key==='ArrowLeft') goPage(page-1);
});

const panel = document.getElementById('panel');
const scrim = document.getElementById('scrim');
function openPanel(n){
  panel.style.setProperty('--c', n.c);
  panel.style.setProperty('--cg', n.c+'55');
  const pav = document.getElementById('pavatar');
  const avs = AVATARS[n.id];
  pav.classList.toggle('duo', Array.isArray(avs));
  pav.querySelectorAll('img').forEach(i=>i.remove());
  (Array.isArray(avs) ? avs : [avs]).forEach(s=>{
    const im = document.createElement('img');
    im.src = s; im.alt = L(n.name); im.draggable = false;
    pav.appendChild(im);
  });
  document.getElementById('pname').textContent = L(n.name);
  const ps = document.getElementById('psub');
  ps.textContent = L(n.sub) || (n.jp ? L(n.jp) : '') || '';
  document.getElementById('ptags').innerHTML = n.tags.map(t=>'<span class="chip '+t+'">'+L(TAGS[t])+'</span>').join('');
  const pd = document.getElementById('pdesc');
  const d = L(n.desc), j = (n.jp && L(n.sub) ? L(n.jp) : '');
  const pcontent = (d ? d : '') + (j ? '<div style="margin-top:10px;color:var(--c);letter-spacing:.18em;font-size:12px">'+j+'</div>' : '');
  pd.innerHTML = pcontent;
  pd.style.display = pcontent ? '' : 'none';
  const pp = document.getElementById('ppics');
  const plist = PICS[n.id];
  if(plist){
    pp.style.display = '';
    pp.classList.toggle('single', plist.length === 1);
    if(plist.length > 1) pp.style.setProperty('--pdur', (plist.length*4)+'s');
    const row = plist.map(s=>'<img src="'+s+'" alt="" draggable="false">').join('');
    document.getElementById('ppictrack').innerHTML = plist.length > 1
      ? '<div class="p-picrow">'+row+'</div><div class="p-picrow">'+row+'</div>'
      : '<div class="p-picrow">'+row+'</div>';
  } else pp.style.display = 'none';
  const rels = EDGES.filter(e=>e.a===n.id || e.b===n.id);
  const pw = document.getElementById('pwrap');
  if(rels.length){
    pw.style.display = '';
    document.getElementById('prel').innerHTML = rels.map(e=>{
      const other = byId[e.a===n.id ? e.b : e.a];
      return '<li style="--c:'+e.c+'"><i></i><span class="rel-type">'+L(e.type)+'</span>'+
        '<button data-id="'+other.id+'" style="--c2:'+other.c+'">'+L(other.name)+'</button></li>';
    }).join('');
    document.querySelectorAll('#prel button').forEach(b=>b.addEventListener('click',ev=>{
      ev.stopPropagation();
      selected = b.dataset.id;
      const t = byId[selected];
      if(t.pg !== page) goPage(t.pg);
      openPanel(t); applyFocus();
    }));
  } else pw.style.display = 'none';
  panel.classList.add('open'); scrim.classList.add('open');
}
function closePanel(){ panel.classList.remove('open'); scrim.classList.remove('open'); }
document.getElementById('pclose').addEventListener('click',()=>{ selected=null; closePanel(); applyFocus() });
scrim.addEventListener('click',()=>{ selected=null; closePanel(); applyFocus() });

document.querySelectorAll('#lang button').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.lang===lang) return;
  lang = b.dataset.lang;
  localStorage.setItem('downot-lang', lang);
  applyLang();
}));

applyText();
buildStage(true);
fit();
updatePager();

const cv = document.getElementById('stars');
const cx = cv.getContext('2d');
let W, H, DPR, stars = [], meteors = [], last = 0;
function sizeCanvas(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  cx.setTransform(DPR,0,0,DPR,0,0);
  stars = Array.from({length:Math.round(W*H/9000)},()=>({
    x:Math.random()*W, y:Math.random()*H,
    r:.4+Math.random()*1.3,
    ph:Math.random()*Math.PI*2, sp:.4+Math.random()*1.4,
    vx:(Math.random()-.5)*.012, vy:(Math.random()-.5)*.008,
    c:Math.random()<.12 ? (Math.random()<.5?'#7dd3fc':'#f9a8d4') : '#e9e7f7'
  }));
}
function spawnMeteor(){
  meteors.push({
    x:Math.random()*W*.8, y:Math.random()*H*.35,
    vx:4+Math.random()*4, vy:1.6+Math.random()*1.6,
    life:1
  });
}
function tick(t){
  const dt = Math.min(50, t-last); last = t;
  cx.clearRect(0,0,W,H);
  for(const s of stars){
    s.x += s.vx*dt; s.y += s.vy*dt;
    if(s.x<0) s.x+=W; if(s.x>W) s.x-=W;
    if(s.y<0) s.y+=H; if(s.y>H) s.y-=H;
    const a = .35 + .55*Math.abs(Math.sin(t*.001*s.sp + s.ph));
    cx.globalAlpha = a;
    cx.fillStyle = s.c;
    cx.beginPath(); cx.arc(s.x,s.y,s.r,0,7); cx.fill();
  }
  if(Math.random() < dt*.00006) spawnMeteor();
  meteors = meteors.filter(m=>m.life>0);
  for(const m of meteors){
    m.x+=m.vx*dt*.06; m.y+=m.vy*dt*.06; m.life -= dt*.0011;
    const gr = cx.createLinearGradient(m.x,m.y,m.x-m.vx*22,m.y-m.vy*22);
    gr.addColorStop(0,'rgba(233,231,247,'+(.85*m.life)+')');
    gr.addColorStop(1,'rgba(233,231,247,0)');
    cx.strokeStyle = gr; cx.lineWidth = 1.6; cx.globalAlpha = 1;
    cx.beginPath(); cx.moveTo(m.x,m.y); cx.lineTo(m.x-m.vx*22,m.y-m.vy*22); cx.stroke();
  }
  cx.globalAlpha = 1;
  requestAnimationFrame(tick);
}
sizeCanvas();
addEventListener('resize', sizeCanvas);
requestAnimationFrame(tick);
</script>
